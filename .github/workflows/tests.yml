name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[video]'
      - run: python -m unittest discover -s tests
      - run: python scripts/check_story_contracts.py
      - run: python -m evovideo_skill.conditioning_runner --config configs/conditioning_graph_search_smoke.json --smoke --output-dir outputs/ci_smoke
