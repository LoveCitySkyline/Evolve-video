[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evovideo-skill"
version = "0.2.0"
description = "Evidence-guided conditioning graph search for video generation"
readme = "README_MINIMAX_H3.md"
requires-python = ">=3.10"
dependencies = ["certifi>=2024.2.2", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
video = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<5"]

[project.scripts]
evovideo-conditioning = "evovideo_skill.conditioning_runner:main"
evovideo-h3 = "evovideo_skill.h3_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
