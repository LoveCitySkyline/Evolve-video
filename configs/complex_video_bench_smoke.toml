name = "complex_video_bench_smoke"
output_dir = "outputs/complex_video_bench_smoke"
ablations = ["full"]

[dataset]
task_files = ["benchmarks/complex_video_bench_1k/complex_video_bench_smoke.json"]
train_ratio = 0.60
validation_ratio = 0.20
seed = 20260731

[evolution]
iterations = 2
frontier_size = 3
no_improvement_limit = 2
selection_strategy = "round_robin"
categories_per_batch = 2
samples_per_category = 1
max_proposals = 3
min_quality_gain = 0.02
cache_enabled = true
path_prior_weight = 0.5
exploration_weight = 0.2
historical_merge_candidates = 2

[foundation]
enabled = true
min_support = 2
min_utility = 0.02
max_motif_size = 4
max_skills = 5
online_enabled = true
online_interval = 1
online_min_support = 2
online_min_advantage = 0.0
online_min_stability = 0.7
online_min_gain = 0.0
online_max_per_category = 2

[runtime]
provider = "local-fake"
duration = 8
sample_frames = 6
enable_vlm_eval = false
strict_eval = true
evolve_on_lte_095 = true
