name = "complex_video_bench_mini5"
output_dir = "outputs/complex_video_bench_mini5"
ablations = ["full"]

[dataset]
task_files = ["benchmarks/complex_video_bench_1k/complex_video_bench_mini5.json"]
train_ratio = 0.60
validation_ratio = 0.20
seed = 20260825

[evolution]
iterations = 2
frontier_size = 2
no_improvement_limit = 2
selection_strategy = "round_robin"
categories_per_batch = 1
samples_per_category = 2
homogeneous_task_batches = true
max_proposals = 2
min_quality_gain = 0.02
cache_enabled = true
continue_mode = false
program_cost_weight = 0.03
path_prior_weight = 0.5
exploration_weight = 0.15
historical_merge_candidates = 2

[foundation]
enabled = false
online_enabled = false

[runtime]
provider = "local-fake"
duration = 8
sample_frames = 6
enable_vlm_eval = false
strict_eval = true
evolve_on_lte_095 = true
